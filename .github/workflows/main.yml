name: Build SagaMC

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        env:
          GRADLE_OPTS: "-Xmx6G -Xms2G"
        run: ./gradlew createMojmapPublisherJar --no-daemon

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CanvasMC-Jar
          path: |
            build/libs/*.jar
            **/build/libs/*.jar
